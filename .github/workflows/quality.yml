name: UnicodeFix quality checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, "fix/**"]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lint PHP files
        run: |
          php -l index.php
          php -l config/tools.php
          php -l includes/header.php
          php -l includes/footer.php
          php tests/site-audit.php
      - name: Check JavaScript syntax
        run: |
          for file in assets/js/*.js; do
            node --check "$file"
          done
      - name: Test legacy engine loading
        run: node tests/js-smoke.js
      - name: Test Unicode and text utility behaviour
        run: node tests/js-utilities-integration.js
      - name: Test legacy converter output mappings
        run: node tests/js-engines-integration.js
